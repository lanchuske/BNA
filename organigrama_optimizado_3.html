                    </form>
                `;

                document.getElementById('newUnitForm').addEventListener('submit', this.handleNewUnitSubmit.bind(this));
            },

            handleNewUnitSubmit(event) {
                event.preventDefault();
                const form = event.target;
                const newUnit = {};
                for (const input of form.elements) {
                    if (input.type !== 'submit' && input.type !== 'button') {
                        newUnit[input.name] = input.value;
                    }
                }

                if (newUnit['Unidad Organizativa'].trim() === '') {
                    Utils.showAlert('El nombre de la unidad no puede estar vacío.', 'error');
                    return;
                }

                if (newUnit['Tipo de Función'] === 'Específica' && (!newUnit['Producto Final'] || newUnit['Producto Final'].trim() === '')) {
                    Utils.showAlert('Para una función Específica, el Producto Final es obligatorio.', 'error');
                    return;
                }

                if (newUnit['Tipo de Función'] === 'Específica' && (!newUnit['Porcentaje Dedicación'] || newUnit['Porcentaje Dedicación'].trim() === '')) {
                    Utils.showAlert('Para una función Específica, el Porcentaje de Dedicación es obligatorio.', 'error');
                    return;
                }

                if (newUnit['Tipo de Función'] === 'Indicador' && (newUnit['Producto Final'] || newUnit['Porcentaje Dedicación'])) {
                    Utils.showAlert('Para una función Indicador, no se permite Producto Final ni Porcentaje de Dedicación.', 'error');
                    return;
                }

                // Agregar la nueva unidad al árbol
                const newNode = {
                    key: newUnit['Unidad Organizativa'] + '|' + newUnit['Reporta A'],
                    nombre: newUnit['Unidad Organizativa'],
                    parent: newUnit['Reporta A'],
                    children: [],
                    item: newUnit,
                    funciones: []
                };

                // Encontrar el nodo padre en el árbol actual
                function findParentNode(nodes, parentName) {
                    for (const node of nodes) {
                        if (node.nombre === parentName) {
                            return node;
                        }
                        if (node.children) {
                            const found = findParentNode(node.children, parentName);
                            if (found) return found;
                        }
                    }
                    return null;
                }

                const parentNode = findParentNode(STATE.treeRoots, newUnit['Reporta A']);

                if (parentNode) {
                    parentNode.children.push(newNode);
                    STATE.treeRoots.push(newNode); // Asegurarse de que la nueva unidad sea raíz si no tiene padre
                } else {
                    // Si el padre no existe, la unidad se convierte en raíz
                    STATE.treeRoots.push(newNode);
                }

                // Actualizar la agrupación por unidad
                const unidadKey = newUnit['Unidad Organizativa'];
                if (!STATE.groupedData[unidadKey]) {
                    STATE.groupedData[unidadKey] = [];
                }
                STATE.groupedData[unidadKey].push(newUnit);

                // Re-renderizar el árbol
                Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));

                // Limpiar el formulario
                form.reset();
                Utils.showAlert('✅ Unidad creada con éxito!', 'success');
                Utils.log('Unidad creada', newUnit);

                // Guardar estado en localStorage
                StorageManager.saveState();

                // Agregar nueva unidad al estado
                STATE.data.push(newUnit);
                STATE.groupedData = DataProcessor.groupByUnidad(STATE.data);
                STATE.treeRoots = DataProcessor.buildTree(STATE.data);
                
                // Guardar estado
                StorageManager.saveState();
                
                // Agregar al historial
                UndoManager.addChange(
                    'Crear nueva unidad',
                    `Unidad creada: ${newUnit['Unidad Organizativa']} - Reporta a: ${newUnit['Reporta A'] || 'Ninguno'}`,
                    UndoManager.getCurrentSnapshot()
                );
                
                // Re-renderizar árbol
                Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));
            },

            cancelEdit() {
                this.newUnitData = null;
                document.getElementById('unidad-content').innerHTML = '<p>Seleccione una unidad para ver sus funciones</p>';
            },

            editUnit(node) {
                if (!this.isEditMode) {
                    Utils.showAlert('Primero, active el modo de edición.', 'warning');
                    return;
                }

                this.newUnitData = node.item;
                this.showEditForm();
            },

            deleteUnit(nodeKey) {
                if (!this.isEditMode) {
                    Utils.showAlert('Primero, active el modo de edición.', 'warning');
                    return;
                }

                if (!confirm('¿Está seguro de que desea eliminar esta unidad? Esta acción no se puede deshacer.')) {
                    return;
                }

                // Encontrar y eliminar el nodo del árbol
                function removeNodeFromTree(nodes, key) {
                    for (let i = 0; i < nodes.length; i++) {
                        if (nodes[i].key === key) {
                            // Mover los hijos al padre (si existe)
                            const node = nodes[i];
                            if (node.children && node.children.length > 0) {
                                // Buscar el padre
                                const parent = findParentNode(STATE.treeRoots, node.nombre);
                                if (parent) {
                                    parent.children.push(...node.children);
                                    // Actualizar el reportaA de los hijos
                                    node.children.forEach(child => {
                                        child.parent = parent.nombre;
                                        child.key = child.nombre + '|' + parent.nombre;
                                        // Actualizar las funciones
                                        if (child.funciones) {
                                            child.funciones.forEach(func => {
                                                func['Reporta A'] = parent.nombre;
                                            });
                                        }
                                    });
                                } else {
                                    // Si no hay padre, los hijos se convierten en raíz
                                    STATE.treeRoots.push(...node.children);
                                    node.children.forEach(child => {
                                        child.parent = '';
                                        child.key = child.nombre + '|';
                                        if (child.funciones) {
                                            child.funciones.forEach(func => {
                                                func['Reporta A'] = '';
                                            });
                                        }
                                    });
                                }
                            }
                            nodes.splice(i, 1);
                            return true;
                        }
                        if (nodes[i].children) {
                            if (removeNodeFromTree(nodes[i].children, key)) {
                                return true;
                            }
                        }
                    }
                    return false;
                }

                function findParentNode(nodes, childName) {
                    for (const node of nodes) {
                        if (node.children) {
                            for (const child of node.children) {
                                if (child.nombre === childName) {
                                    return node;
                                }
                            }
                            const found = findParentNode(node.children, childName);
                            if (found) return found;
                        }
                    }
                    return null;
                }

                if (removeNodeFromTree(STATE.treeRoots, nodeKey)) {
                    // Actualizar groupedData
                    const [nodeName] = nodeKey.split('|');
                    if (STATE.groupedData[nodeName]) {
                        delete STATE.groupedData[nodeName];
                    }

                    // Re-renderizar el árbol
                    Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));

                    Utils.showAlert('✅ Unidad eliminada con éxito!', 'success');
                    Utils.log('Unidad eliminada', { nodeKey });

                    // Guardar estado en localStorage
                    StorageManager.saveState();
                    
                    // Agregar al historial
                    UndoManager.addChange(
                        'Eliminar unidad',
                        `Unidad eliminada: ${nodeName} - ${node.funciones.length} funciones eliminadas`,
                        UndoManager.getCurrentSnapshot()
                    );
                    
                    // Re-renderizar árbol
                    Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));
                } else {
                    Utils.showAlert('❌ No se pudo encontrar la unidad para eliminar.', 'error');
                }
            },

            moveUnit(draggedKey, targetKey) {
                if (!this.isEditMode) {
                    return;
                }

                const [draggedName] = draggedKey.split('|');
                const [targetName] = targetKey.split('|');

                if (draggedName === targetName) {
                    Utils.showAlert('No se puede mover una unidad sobre sí misma.', 'warning');
                    return;
                }

                // Verificar que no se cree una referencia circular
                function isDescendant(nodes, parentName, childName) {
                    for (const node of nodes) {
                        if (node.nombre === parentName) {
                            if (node.children) {
                                for (const child of node.children) {
                                    if (child.nombre === childName || isDescendant([child], child.nombre, childName)) {
                                        return true;
                                    }
                                }
                            }
                        }
                    }
                    return false;
                }

                if (isDescendant(STATE.treeRoots, draggedName, targetName)) {
                    Utils.showAlert('No se puede mover una unidad padre dentro de su hijo (referencia circular).', 'error');
                    return;
                }

                // Encontrar el nodo arrastrado
                function findNode(nodes, key) {
                    for (const node of nodes) {
                        if (node.key === key) {
                            return { node, parent: null, index: nodes.indexOf(node) };
                        }
                        if (node.children) {
                            for (let i = 0; i < node.children.length; i++) {
                                if (node.children[i].key === key) {
                                    return { node: node.children[i], parent: node, index: i };
                                }
                            }
                            const found = findNode(node.children, key);
                            if (found) return found;
                        }
                    }
                    return null;
                }

                const draggedNodeInfo = findNode(STATE.treeRoots, draggedKey);
                const targetNodeInfo = findNode(STATE.treeRoots, targetKey);

                if (!draggedNodeInfo || !targetNodeInfo) {
                    Utils.showAlert('No se pudieron encontrar las unidades especificadas.', 'error');
                    return;
                }

                // Remover el nodo de su ubicación actual
                if (draggedNodeInfo.parent) {
                    draggedNodeInfo.parent.children.splice(draggedNodeInfo.index, 1);
                } else {
                    STATE.treeRoots.splice(draggedNodeInfo.index, 1);
                }

                // Actualizar el nodo arrastrado
                const draggedNode = draggedNodeInfo.node;
                draggedNode.parent = targetName;
                draggedNode.key = draggedName + '|' + targetName;

                // Actualizar las funciones del nodo arrastrado
                if (draggedNode.funciones) {
                    draggedNode.funciones.forEach(func => {
                        func['Reporta A'] = targetName;
                    });
                }

                // Agregar el nodo como hijo del objetivo
                if (!targetNodeInfo.node.children) {
                    targetNodeInfo.node.children = [];
                }
                targetNodeInfo.node.children.push(draggedNode);

                // Re-renderizar el árbol
                Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));

                Utils.showAlert(`✅ Unidad "${draggedName}" movida bajo "${targetName}"!`, 'success');
                Utils.log('Unidad movida', { from: draggedKey, to: targetKey });

                // Guardar estado en localStorage
                StorageManager.saveState();
                
                // Guardar orden personalizado de unidades
                this.saveCustomUnitOrder();
            },

            // Guardar orden personalizado de unidades en localStorage
            saveCustomUnitOrder() {
                const customOrder = this.generateCurrentUnitOrder();
                localStorage.setItem('customUnitOrder', JSON.stringify(customOrder));
                console.log('Orden personalizado de unidades guardado:', customOrder);
            },

            // Obtener orden personalizado de unidades desde localStorage
            getCustomUnitOrder() {
                const customOrder = JSON.parse(localStorage.getItem('customUnitOrder') || '[]');
                return customOrder;
            },

            // Generar orden actual del árbol
            generateCurrentUnitOrder() {
                const order = [];
                
                function traverseTree(nodes) {
                    nodes.forEach(node => {
                        order.push(node.nombre);
                        if (node.children && node.children.length > 0) {
                            traverseTree(node.children);
                        }
                    });
                }
                
                if (STATE.treeRoots && STATE.treeRoots.length > 0) {
                    traverseTree(STATE.treeRoots);
                }
                
                return order;
            },

            // Limpiar orden personalizado de unidades
            clearCustomUnitOrder() {
                localStorage.removeItem('customUnitOrder');
                console.log('Orden personalizado de unidades limpiado');
            },

            // Reordenar unidades en el mismo nivel
            reorderUnit(draggedKey, targetKey, position = 'after') {
                if (!this.isEditMode) {
                    return;
                }

                const [draggedName] = draggedKey.split('|');
                const [targetName] = targetKey.split('|');

                if (draggedName === targetName) {
                    return; // No hacer nada si es la misma unidad
                }

                // Encontrar los nodos
                function findNode(nodes, key) {
                    for (const node of nodes) {
                        if (node.key === key) {
                            return { node, parent: null, index: nodes.indexOf(node) };
                        }
                        if (node.children) {
                            for (let i = 0; i < node.children.length; i++) {
                                if (node.children[i].key === key) {
                                    return { node: node.children[i], parent: node, index: i };
                                }
                            }
                            const found = findNode(node.children, key);
                            if (found) return found;
                        }
                    }
                    return null;
                }

                const draggedNodeInfo = findNode(STATE.treeRoots, draggedKey);
                const targetNodeInfo = findNode(STATE.treeRoots, targetKey);

                if (!draggedNodeInfo || !targetNodeInfo) {
                    return;
                }

                // Verificar que estén en el mismo nivel (mismo padre)
                if (draggedNodeInfo.parent !== targetNodeInfo.parent) {
                    return;
                }

                // Obtener la lista de nodos del mismo nivel
                const siblings = draggedNodeInfo.parent ? 
                    draggedNodeInfo.parent.children : STATE.treeRoots;

                // Remover el nodo arrastrado
                siblings.splice(draggedNodeInfo.index, 1);

                // Calcular nueva posición
                let newIndex = targetNodeInfo.index;
                if (position === 'after') {
                    newIndex++;
                }
                if (draggedNodeInfo.index < targetNodeInfo.index) {
                    newIndex--;
                }

                // Insertar en nueva posición
                siblings.splice(newIndex, 0, draggedNodeInfo.node);

                // Re-renderizar el árbol
                Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));

                Utils.showAlert(`✅ Unidad "${draggedName}" reordenada!`, 'success');
                Utils.log('Unidad reordenada', { from: draggedKey, to: targetKey, position });

                // Guardar estado en localStorage
                StorageManager.saveState();
                
                // Guardar orden personalizado de unidades
                this.saveCustomUnitOrder();
                
                // Agregar al historial
                UndoManager.addChange(
                    'Mover unidad',
                    `Unidad movida: ${draggedName} - Nuevo padre: ${targetName}`,
                    UndoManager.getCurrentSnapshot()
                );
            }
        };

                            funcionesOrdenadas.sort((a, b) => {
                                const tipoA = a['Tipo de Función'] || 'Genérica';
                                const tipoB = b['Tipo de Función'] || 'Genérica';
                                const getPriority = (tipo) => {
                                    if (tipo.includes('Genérica')) return 1;
                                    if (tipo.includes('Específica')) return 2;
                                    if (tipo.includes('Indicador')) return 3;
                                    return 4;
                                };
                                return getPriority(tipoA) - getPriority(tipoB);
                            });
                        }
                        
                        // Agrupar funciones por tipo respetando el orden personalizado
                        const functionsByType = {};
                        funcionesOrdenadas.forEach(func => {
                            const type = func['Tipo de Función'];
                            if (!functionsByType[type]) {
                                functionsByType[type] = [];
                            }
                            functionsByType[type].push(func);
                        });
                        
                        console.log('Tipos de funciones encontrados:', Object.keys(functionsByType));
                        
                        // Generar tablas para cada tipo de función
                        Object.keys(functionsByType).forEach(type => {
                            const typeFunctions = functionsByType[type];
                            
                            // Determinar el título y estructura de la tabla según el tipo
                            let tableTitle, tableHeaders, tableRows;
                            
                            if (type === 'Genérica') {
                                // Funciones Genéricas: quitar columna Tipo
                                tableTitle = 'Funciones Genéricas';
                                tableHeaders = `
                                    <tr>
                                        <th style="width: 50%;">Función Genérica</th>
                                        <th style="width: 50%;">Producto Final</th>
                                    </tr>
                                `;
                                tableRows = typeFunctions.map(func => {
                                    const functionDescription = func['Descripción'] || 'No especificada';
                                    const productFinal = func['Producto Final'] || 'No especificado';
                                    return `
                                        <tr>
                                            <td>${functionDescription}</td>
                                            <td>${productFinal}</td>
                                        </tr>
                                    `;
                                }).join('');
                                
                            } else if (type === 'Específica') {
                                // Funciones Específicas: mantener estructura original
                                tableTitle = 'Funciones Específicas';
                                tableHeaders = `
                                    <tr>
                                        <th style="width: 40%;">Función Específica</th>
                                        <th style="width: 40%;">Producto Final</th>
                                        <th style="width: 20%;">% Dedicación</th>
                                    </tr>
                                `;
                                tableRows = typeFunctions.map(func => {
                                    const functionDescription = func['Descripción'] || 'No especificada';
                                    const productFinal = func['Producto Final'] || 'No especificado';
                                    const dedicationPercent = (func['Porcentaje Dedicación'] || '0') + '%';
                                    return `
                                        <tr>
                                            <td>${functionDescription}</td>
                                            <td>${productFinal}</td>
                                            <td style="text-align: center;">${dedicationPercent}</td>
                                        </tr>
                                    `;
                                }).join('');
                                
                            } else if (type === 'Indicador') {
                                // Indicadores: cambiar nombre y quitar columnas Producto Final y Tipo
                                tableTitle = 'Indicadores';
                                tableHeaders = `
                                    <tr>
                                        <th style="width: 100%;">Indicador</th>
                                    </tr>
                                `;
                                tableRows = typeFunctions.map(func => {
                                    const functionDescription = func['Descripción'] || 'No especificada';
                                    return `
                                        <tr>
                                            <td>${functionDescription}</td>
                                        </tr>
                                    `;
                                }).join('');
                                
                            } else {
                                // Otros tipos: mantener estructura original
                                tableTitle = `Funciones ${type}`;
                                tableHeaders = `
                                    <tr>
                                        <th style="width: 40%;">Función ${type}</th>
                                        <th style="width: 40%;">Producto Final</th>
                                        <th style="width: 20%;">Tipo</th>
                                    </tr>
                                `;
                                tableRows = typeFunctions.map(func => {
                                    const functionDescription = func['Descripción'] || 'No especificada';
                                    const productFinal = func['Producto Final'] || 'No especificado';
                                    return `
                                        <tr>
                                            <td>${functionDescription}</td>
                                            <td>${productFinal}</td>
                                            <td style="text-align: center;">${type}</td>
                                        </tr>
                                    `;
                                }).join('');
                            }
                            
                            unitContent += `
                                <div class="table-title">${tableTitle}</div>
                                <table class="functions-table">
                                    <thead>
                                        ${tableHeaders}
                                    </thead>
                                    <tbody>
                                        ${tableRows}
                                    </tbody>
                                </table>
                            `;
                        });
                        
                        unitContent += `
                            </div>
                        `;
                        
                        // Solo agregar salto de página si no es la primera unidad
                        if (index > 0) {
                            pdfHTML += '<div class="page-break"></div>';
                        }
                        
                        pdfHTML += unitContent;
                    });
                    
                    pdfHTML += `
                        <div class="footer">
                            Magna Partners - Analizador de Organigramas | 
                            Generado el ${new Date().toLocaleDateString('es-ES')} a las ${new Date().toLocaleTimeString('es-ES')} | 
                            Total de unidades: ${units.length}
                        </div>
                        </body>
                        </html>
                    `;
                    
                    console.log('Contenido PDF generado exitosamente');
                    return pdfHTML;
                    
                } catch (error) {
                    console.error('Error al generar contenido PDF:', error);
                    throw new Error(`Error al generar contenido PDF: ${error.message}`);
                }
            },
            
            getHierarchicalOrder() {
                const orderedUnits = [];
                
                // Verificar si hay orden personalizado guardado
                const customOrder = JSON.parse(localStorage.getItem('customUnitOrder') || '[]');
                console.log('Orden personalizado encontrado:', customOrder);
                
                if (customOrder.length > 0) {
                    // Usar orden personalizado
                    console.log('Usando orden personalizado de unidades');
                    customOrder.forEach((unitName, index) => {
                        const unitData = STATE.groupedData[unitName];
                        if (unitData && unitData.length > 0) {
                            orderedUnits.push(unitData);
                            console.log(`${index + 1}. Agregando unidad al PDF (orden personalizado): ${unitName}`);
                        }
                    });
                } else {
                    // Obtener el orden exacto del árbol desde el DOM
                    const treeContainer = document.getElementById('tree-container');
                    if (treeContainer) {
                        const treeNodes = treeContainer.querySelectorAll('.tree-node');
                        console.log(`Encontrados ${treeNodes.length} nodos en el árbol`);
                        
                        treeNodes.forEach((nodeElement, index) => {
                            // Obtener el nombre de la unidad desde el contenido del nodo
                            const nodeNameElement = nodeElement.querySelector('.node-name');
                            if (nodeNameElement) {
                                const unitName = nodeNameElement.textContent.trim();
                                const unitData = STATE.groupedData[unitName];
                                if (unitData && unitData.length > 0) {
                                    orderedUnits.push(unitData);
                                    console.log(`${index + 1}. Agregando unidad al PDF: ${unitName}`);
                                }
                            }
                        });
                    }
                    
                    // Si no se pudo obtener del DOM, usar el árbol en memoria
                    if (orderedUnits.length === 0) {
                        console.log('No se pudo obtener orden del DOM, usando árbol en memoria');
                        
                        function traverseTree(nodes) {
                            nodes.forEach(node => {
                                const unitName = node.nombre;
                                const unitData = STATE.groupedData[unitName];
                                
                                if (unitData && unitData.length > 0) {
                                    orderedUnits.push(unitData);
                                    console.log(`Agregando unidad al PDF: ${unitName}`);
                                }
                                
                                if (node.children && node.children.length > 0) {
                                    traverseTree(node.children);
                                }
                            });
                        }
                        
                        if (STATE.treeRoots && STATE.treeRoots.length > 0) {
                            traverseTree(STATE.treeRoots);
                        } else {
                            const tempTree = DataProcessor.buildTree(STATE.data);
                            traverseTree(tempTree);
                        }
                    }
                }
                
                console.log(`Orden jerárquico generado: ${orderedUnits.length} unidades`);
                console.log('Unidades incluidas:', orderedUnits.map(unit => unit[0]['Unidad Organizativa']));
                return orderedUnits;
            }
        };

        // ===== GESTOR DE DESHACER =====
        const UndoManager = {
            history: [],
            maxHistory: 10,
            
            // Agregar cambio al historial
            addChange(action, details, dataSnapshot) {
                const change = {
                    id: Date.now(),
                    action: action,
                    details: details,
                    timestamp: new Date(),
                    dataSnapshot: JSON.parse(JSON.stringify(dataSnapshot)), // Deep copy
                    canUndo: true
                };
                
                this.history.unshift(change);
                
                // Mantener solo los últimos 10 cambios
                if (this.history.length > this.maxHistory) {
                    this.history = this.history.slice(0, this.maxHistory);
                }
                
                // Guardar en localStorage
                this.saveHistory();
                
                console.log(`Cambio agregado al historial: ${action}`, change);
                Utils.log(`Cambio agregado: ${action}`, { action, details });
            },
            
            // Deshacer un cambio específico
            undoChange(changeId) {
                const changeIndex = this.history.findIndex(change => change.id === changeId);
                
                if (changeIndex === -1) {
                    Utils.showAlert('No se encontró el cambio para deshacer', 'error');
                    return;
                }
                
                const change = this.history[changeIndex];
                
                try {
                    // Restaurar el snapshot de datos
                    STATE.data = change.dataSnapshot.data || [];
                    STATE.groupedData = change.dataSnapshot.groupedData || {};
                    STATE.treeRoots = change.dataSnapshot.treeRoots || [];
                    STATE.expandedNodes = change.dataSnapshot.expandedNodes || {};
                    
                    // Re-renderizar el árbol
                    Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));
                    
                    // Remover el cambio del historial
                    this.history.splice(changeIndex, 1);
                    this.saveHistory();
                    
                    // Actualizar la interfaz
                    this.updateHistoryDisplay();
                    
                    Utils.showAlert(`✅ Cambio deshecho: ${change.action}`, 'success');
                    Utils.log(`Cambio deshecho: ${change.action}`, { action: change.action, details: change.details });
                    
                } catch (error) {
                    console.error('Error al deshacer cambio:', error);
                    Utils.showAlert('Error al deshacer el cambio', 'error');
                }
            },
            
            // Mostrar historial
            showHistory() {
                const modal = document.getElementById('historyModal');
                const historyList = document.getElementById('historyList');
                
                if (this.history.length === 0) {
                    historyList.innerHTML = '<div class="no-history">No hay cambios en el historial</div>';
                } else {
                    this.updateHistoryDisplay();
                }
                
                modal.style.display = 'block';
            },
            
            // Ocultar historial
            hideHistory() {
                const modal = document.getElementById('historyModal');
                modal.style.display = 'none';
            },
            
            // Actualizar la visualización del historial
            updateHistoryDisplay() {
                const historyList = document.getElementById('historyList');
                
                historyList.innerHTML = this.history.map(change => {
                    const timeStr = this.formatTime(change.timestamp);
                    
                    return `
                        <div class="history-item" data-change-id="${change.id}">
                            <div class="history-header">
                                <span class="history-action">${change.action}</span>
                                <span class="history-time">${timeStr}</span>
                            </div>
                            <div class="history-details">${change.details}</div>
                            <div class="history-actions">
                                <button class="undo-btn" onclick="UndoManager.undoChange(${change.id})" 
                                        ${!change.canUndo ? 'disabled' : ''}>
                                    ↶ Deshacer
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            },
            
            // Formatear tiempo
            formatTime(timestamp) {
                const now = new Date();
                const diff = now - timestamp;
                const minutes = Math.floor(diff / (1000 * 60));
                const hours = Math.floor(diff / (1000 * 60 * 60));
                
                if (minutes < 1) {
                    return 'Hace menos de 1 minuto';
                } else if (minutes < 60) {
                    return `Hace ${minutes} minuto${minutes !== 1 ? 's' : ''}`;
                } else if (hours < 24) {
                    return `Hace ${hours} hora${hours !== 1 ? 's' : ''}`;
                } else {
                    return timestamp.toLocaleString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
            },
            
            // Guardar historial en localStorage
            saveHistory() {
                try {
                    localStorage.setItem('undoHistory', JSON.stringify(this.history));
                } catch (error) {
                    console.error('Error al guardar historial:', error);
                }
            },
            
            // Cargar historial desde localStorage
            loadHistory() {
                try {
                    const savedHistory = localStorage.getItem('undoHistory');
                    if (savedHistory) {
                        this.history = JSON.parse(savedHistory);
                        console.log(`Historial cargado: ${this.history.length} cambios`);
                    }
                } catch (error) {
                    console.error('Error al cargar historial:', error);
                    this.history = [];
                }
            },
            
            // Limpiar historial
            clearHistory() {
                this.history = [];
                this.saveHistory();
                console.log('Historial limpiado');
            },
            
            // Obtener snapshot actual de datos
            getCurrentSnapshot() {
                return {
                    data: STATE.data,
                    groupedData: STATE.groupedData,
                    treeRoots: STATE.treeRoots,
                    expandedNodes: STATE.expandedNodes
                };
            }
        };

        // ===== EVENT LISTENERS OPTIMIZADOS =====
    </script>
