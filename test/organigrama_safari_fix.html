    <style>

        .tree-list {

        .tree-children {
            list-style: none;

        .alert {

        .alert-success {

        .function-item {

        }
        
        .functions-container {

        .functions-container.drag-mode .function-item {

        .function-type {

        /* Estilos para modo edición */
        .edit-mode-btn.active {

        @keyframes pulse {

        /* Estilos para grupos de botones */
        .button-group {
            display: -webkit-box;

<body>
    <div class="container">
        <header>
            <h1>Magna Partners - Analizador de Organigramas</h1>
        </header>
        
        <div class="controls">
            <input type="file" id="fileInput" accept=".csv,.json" class="hidden">
            <div class="button-group">
                <button id="browseBtn" class="btn btn-primary">📁 Cargar Archivo</button>
                <button id="exportBtn" class="btn btn-success">📤 Exportar JSON</button>
                <button id="validateBtn" class="btn btn-warning">🔍 Validar Datos</button>
                <button onclick="Importer.loadSavedData()" class="btn btn-info">📂 Cargar Datos Guardados</button>
                <button onclick="Importer.clearSavedData()" class="btn btn-secondary">🗑️ Limpiar Datos</button>
            </div>
            <div class="button-group">
                <button onclick="Editor.createNewUnit()" class="btn btn-primary">➕ Crear Unidad</button>
                <button onclick="toggleEditMode()" class="btn btn-secondary edit-mode-btn">✏️ Modo Edición</button>
                <button onclick="PDFExporter.exportToPDF()" class="btn btn-danger">📄 Exportar PDF</button>
                <button onclick="UndoManager.showHistory()" class="btn btn-warning">↶ Historial (10)</button>
            </div>
            <div id="saveIndicator" class="alert hidden"></div>
        </div>

        <div class="main-content">
            <div id="tree-container" class="tree-container"></div>
            <div id="unidad-content" class="content-area"></div>
        </div>
    </div>

    <script>
        // ===== CONFIGURACIÓN GLOBAL OPTIMIZADA PARA SAFARI =====
        const CONFIG = {
            VERSION: '2.0-safari-fix',
            SUPPORTED_FORMATS: ['csv', 'json'],
            VALIDATION_RULES: {
                REQUIRED_FIELDS: ['Unidad Organizativa', 'Tipo de Función'],
                FUNCTION_TYPES: ['Genérica', 'Específica', 'Indicador']
            }
        };

        // ===== ESTADO GLOBAL OPTIMIZADO =====
        const STATE = {
            data: [],
            headers: [],
            treeRoots: [],
            expandedNodes: JSON.parse(localStorage.getItem('expandedNodes') || '{}'),
            lastSelected: '',
            groupedData: {},
            validationIssues: [],
            exportQuality: 0,
            totalFunctions: 0,
            totalUnits: 0,
            stats: {
                byType: { generica: 0, especifica: 0, indicador: 0 },
                quality: { complete: 0, incomplete: 0 },
                qualityScore: 0
            }
        };

        // ===== UTILIDADES OPTIMIZADAS PARA SAFARI =====
        const Utils = {
            showAlert(message, type = 'info', duration = 3000) {
                const indicator = document.getElementById('saveIndicator');
                if (indicator) {
                    indicator.textContent = message;
                    indicator.className = `alert alert-${type === 'error' ? 'error' : type === 'warning' ? 'warning' : 'success'} show`;
                    setTimeout(() => indicator.classList.remove('show'), duration);
                }
            },

            log(message, data = null) {
                console.log(`[${new Date().toLocaleTimeString()}] ${message}`, data || '');
            },

            debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            },

            // Función específica para Safari para crear elementos de forma segura
            createElementSafari(tagName, className, innerHTML) {
                try {
                    const element = document.createElement(tagName);
                    if (className) {
                        element.className = className;
                    }
                    if (innerHTML) {
                        element.innerHTML = innerHTML;
                    }
                    return element;
                } catch (error) {
                    console.error('Error creando elemento en Safari:', error);
                    return null;
                }
            },

            // Función para agregar elementos de forma segura en Safari
            appendChildSafari(parent, child) {
                try {
                    if (parent && child) {
                        parent.appendChild(child);
                        return true;
                    }
                    return false;
                } catch (error) {
                    console.error('Error agregando elemento en Safari:', error);
                    return false;
                }
            }
        };

        // ===== PROCESAMIENTO DE DATOS OPTIMIZADO PARA SAFARI =====
        const DataProcessor = {
            parseCSV(csvText) {
                try {
                    const lines = csvText.trim().split('\n');
                    const headers = lines[0].split(';').map(h => h.replace(/"/g, ''));
                    const data = [];
                    
                    for (let i = 1; i < lines.length; i++) {
                        if (lines[i].trim()) {
                            const values = lines[i].split(';').map(v => v.replace(/"/g, ''));
                            const row = {};
                            headers.forEach((header, index) => {
                                row[header] = values[index] || '';
                            });
                            data.push(row);
                        }
                    }
                    
                    return { data, headers };
                } catch (error) {
                    console.error('Error procesando CSV:', error);
                    throw error;
                }
            },
            
            groupByUnidad(data) {
                const grouped = {};
                data.forEach(row => {
                    const unidad = row['Unidad Organizativa'];
                    if (!grouped[unidad]) grouped[unidad] = [];
                    grouped[unidad].push(row);
                });
                return grouped;
            },
            
            buildTree(data) {
                try {
                    const nodeMap = {};
                    
                    // Crear nodos para cada unidad organizativa única
                    data.forEach(item => {
                        const nombre = item['Unidad Organizativa'];
                        const parent = item['Reporta A'] || '';
                        const key = nombre + '|' + parent;
                        
                        if (!nodeMap[key]) {
                            nodeMap[key] = { 
                                key, 
                                nombre, 
                                parent, 
                                children: [], 
                                item,
                                funciones: []
                            };
                        }
                        nodeMap[key].funciones.push(item);
                    });
                    
                    // Relacionar hijos con padres
                    Object.values(nodeMap).forEach(node => {
                        if (node.parent) {
                            const parentKey = Object.keys(nodeMap).find(k => {
                                const [parentName] = k.split('|');
                                return parentName === node.parent;
                            });
                            
                            if (parentKey && nodeMap[parentKey]) {
                                nodeMap[parentKey].children.push(node);
                            }
                        }
                    });
                    
                    // Encontrar raíces
                    const roots = Object.values(nodeMap).filter(node => {
                        if (!node.parent) return true;
                        
                        const parentExists = Object.keys(nodeMap).some(k => {
                            const [parentName] = k.split('|');
                            return parentName === node.parent;
                        });
                        
                        return !parentExists;
                    });
                    
                    return roots;
                } catch (error) {
                    console.error('Error construyendo árbol:', error);
                    return [];
                }
            }
        };
        
        // ===== RENDERIZADO OPTIMIZADO PARA SAFARI =====
        const Renderer = {
            renderTree(nodes, container) {
                try {
                    if (!container) {
                        console.error('Contenedor no encontrado para renderizar árbol');
                        return;
                    }
                    
                    // Limpiar contenedor de forma segura
                    container.innerHTML = '';
                    
                    const ul = Utils.createElementSafari('ul', 'tree-list');
                    if (!ul) {
                        console.error('No se pudo crear elemento ul');
                        return;
                    }
                    
                    nodes.forEach(node => {
                        const li = this.renderNode(node, ul);
                        if (li) {
                            Utils.appendChildSafari(ul, li);
                        }
                    });
                    
                    Utils.appendChildSafari(container, ul);
                    
                    console.log('Árbol renderizado exitosamente:', nodes.length, 'nodos');
                    
                } catch (error) {
                    console.error('Error renderizando árbol:', error);
                }
            },
            
            renderNode(node, container, level = 0) {
                try {
                    const li = Utils.createElementSafari('li', 'tree-node');
                    if (!li) {
                        console.error('No se pudo crear elemento li');
                        return null;
                    }
                    
                    li.setAttribute('data-key', node.key);
                    
                    const hasChildren = node.children && node.children.length > 0;
                    const isExpanded = STATE.expandedNodes[node.key];
                    
                    const nodeContent = Utils.createElementSafari('div', 'node-content');
                    if (!nodeContent) {
                        console.error('No se pudo crear node-content');
                        return null;
                    }
                    
                    // Configurar click handler de forma segura
                    nodeContent.onclick = () => this.selectNode(node);
                    
                    // Icono y nombre
                    const icon = hasChildren ? (isExpanded ? '📂' : '📁') : '📄';
                    const toggleIcon = hasChildren ? (isExpanded ? '[–]' : '[+]') : '';
                    
                    nodeContent.innerHTML = `
                        <span class="tree-toggle" onclick="event.stopPropagation(); toggleNode('${node.key}')">
                            ${toggleIcon}
                        </span>
                        <span class="node-icon">${icon}</span>
                        <span class="node-name">${node.nombre}</span>
                    `;
                    
                    Utils.appendChildSafari(li, nodeContent);
                    
                    // Hijos expandidos
                    if (hasChildren && isExpanded) {
                        const childrenContainer = Utils.createElementSafari('ul', 'tree-children');
                        if (childrenContainer) {
                            childrenContainer.style.marginLeft = `${(level + 1) * 20}px`;
                            
                            node.children.forEach(child => {
                                const childLi = this.renderNode(child, childrenContainer, level + 1);
                                if (childLi) {
                                    Utils.appendChildSafari(childrenContainer, childLi);
                                }
                            });
                            
                            Utils.appendChildSafari(li, childrenContainer);
                        }
                    }
                    
                    return li;
                    
                } catch (error) {
                    console.error('Error renderizando nodo:', error);
                    return null;
                }
            },
            
            selectNode(node) {
                try {
                    STATE.lastSelected = node.key;
                    
                    // Limpiar selección anterior
                    document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('selected'));
                    
                    // Seleccionar nodo actual
                    const selectedElement = document.querySelector(`[data-key="${node.key}"]`);
                    if (selectedElement) {
                        selectedElement.classList.add('selected');
                    }
                    
                    // Mostrar contenido
                    if (node.funciones && node.funciones.length > 0) {
                        this.showUnidad(node.funciones);
                    } else if (node.children && node.children.length > 0) {
                        this.showUnidadSummary(node);
                    }
                    
                } catch (error) {
                    console.error('Error seleccionando nodo:', error);
                }
            },
            
            showUnidad(funciones) {
                try {
                    const container = document.getElementById('unidad-content');
                    if (!container) {
                        console.error('Contenedor unidad-content no encontrado');
                        return;
                    }
                    
                    const unidad = funciones[0];
                    
                    container.innerHTML = `
                        <div class="unidad-header">
                            <h2>${unidad['Unidad Organizativa']}</h2>
                            ${unidad['Misión'] ? `<p><strong>Misión:</strong> ${unidad['Misión']}</p>` : ''}
                            ${unidad['Reporta A'] ? `<p><strong>Reporta a:</strong> ${unidad['Reporta A']}</p>` : ''}
                        </div>
                        <div class="unidad-stats">
                            <p><strong>Total funciones:</strong> ${funciones.length}</p>
                        </div>
                        <div class="functions-container">
                            ${funciones.map((func, index) => {
                                const tipo = func['Tipo de Función'] || 'Genérica';
                                return `
                                    <div class="function-item">
                                        <div class="function-content">
                                            <span class="function-type type-${tipo.toLowerCase()}">
                                                ${tipo}
                                            </span>
                                            <h4>${func['Descripción'] || 'Sin descripción'}</h4>
                                            ${func['Producto Final'] ? `<p><strong>Producto Final:</strong> ${func['Producto Final']}</p>` : ''}
                                            ${func['Porcentaje Dedicación'] ? `<p><strong>Dedicación:</strong> ${func['Porcentaje Dedicación']}</p>` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                    
                } catch (error) {
                    console.error('Error mostrando unidad:', error);
                }
            },
            
            showUnidadSummary(node) {
                try {
                    const container = document.getElementById('unidad-content');
                    if (!container) {
                        console.error('Contenedor unidad-content no encontrado');
                        return;
                    }
                    
                    const totalFunciones = node.children.reduce((sum, child) => sum + (child.funciones ? child.funciones.length : 0), 0);
                    
                    container.innerHTML = `
                        <div class="unidad-header">
                            <h2>${node.nombre}</h2>
                            <p><strong>Unidad padre con ${node.children.length} subunidades que le reportan</strong></p>
                        </div>
                        <div class="unidad-stats">
                            <p><strong>Subunidades que reportan:</strong> ${node.children.length}</p>
                            <p><strong>Total funciones de subunidades:</strong> ${totalFunciones}</p>
                        </div>
                    `;
                    
                } catch (error) {
                    console.error('Error mostrando resumen de unidad:', error);
                }
            }
        };

        // ===== IMPORTACIÓN OPTIMIZADA PARA SAFARI =====
        const Importer = {
            processFile(file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const content = e.target.result;
                    const extension = file.name.split('.').pop().toLowerCase();
                    
                    if (extension === 'csv') {
                        this.processCSV(content, file.name);
                    } else if (extension === 'json') {
                        this.processJSON(content, file.name);
                    } else {
                        Utils.showAlert('Formato de archivo no soportado. Use CSV o JSON.', 'error');
                    }
                }.bind(this);
                
                reader.readAsText(file);
            },
            
            processCSV(content, filename) {
                try {
                    const { data, headers } = DataProcessor.parseCSV(content);
                    
                    // Contar unidades únicas
                    const unidadesUnicas = new Set();
                    data.forEach(item => {
                        if (item['Unidad Organizativa'] && item['Unidad Organizativa'].trim()) {
                            unidadesUnicas.add(item['Unidad Organizativa'].trim());
                        }
                    });
                    
                    // Procesar datos
                    STATE.data = data;
                    STATE.groupedData = DataProcessor.groupByUnidad(data);
                    STATE.treeRoots = DataProcessor.buildTree(data);
                    
                    // Guardar estado
                    localStorage.setItem('magnaPartnersOrganigram', JSON.stringify({
                        data: STATE.data,
                        groupedData: STATE.groupedData,
                        treeRoots: STATE.treeRoots,
                        timestamp: new Date().toISOString()
                    }));
                    
                    // Renderizar
                    Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));
                    
                    Utils.showAlert(`✅ CSV cargado: ${data.length} registros, ${unidadesUnicas.size} unidades`, 'success');
                    Utils.log('CSV procesado exitosamente', { data: data.length, units: unidadesUnicas.size });
                    
                } catch (error) {
                    Utils.showAlert('Error al procesar el archivo CSV: ' + error.message, 'error');
                    Utils.log('Error procesando CSV', error);
                }
            },
            
            processJSON(content) {
                try {
                    const jsonData = JSON.parse(content);
                    
                    let data = [];
                    
                    if (jsonData.data && jsonData.data.unidades) {
                        // Formato optimizado
                        jsonData.data.unidades.forEach(unidad => {
                            unidad.funciones.forEach(func => {
                                data.push({
                                    'Unidad Organizativa': unidad.nombre,
                                    'Reporta A': unidad.reportaA || '',
                                    'Misión': unidad.mision || '',
                                    'Tipo de Función': func.tipo || 'Genérica',
                                    'Descripción': func.descripcion || '',
                                    'Producto Final': func.productoFinal || '',
                                    'Porcentaje Dedicación': func.porcentajeDedicacion || ''
                                });
                            });
                        });
                    } else if (jsonData.unidades) {
                        // Formato legacy
                        jsonData.unidades.forEach(unidad => {
                            unidad.funciones.forEach(func => {
                                data.push({
                                    'Unidad Organizativa': unidad.nombre,
                                    'Reporta A': unidad.reportaA || '',
                                    'Misión': unidad.mision || '',
                                    'Tipo de Función': func.tipo || 'Genérica',
                                    'Descripción': func.descripcion || '',
                                    'Producto Final': func.productoFinal || '',
                                    'Porcentaje Dedicación': func.porcentajeDedicacion || ''
                                });
                            });
                        });
                    } else {
                        throw new Error('Formato JSON no reconocido');
                    }
                    
                    if (data.length === 0) {
                        throw new Error('No se encontraron datos válidos en el archivo JSON');
                    }
                    
                    // Contar unidades únicas
                    const unidadesUnicas = new Set();
                    data.forEach(item => {
                        if (item['Unidad Organizativa'] && item['Unidad Organizativa'].trim()) {
                            unidadesUnicas.add(item['Unidad Organizativa'].trim());
                        }
                    });
                    
                    STATE.data = data;
                    STATE.groupedData = DataProcessor.groupByUnidad(data);
                    STATE.treeRoots = DataProcessor.buildTree(data);
                    
                    // Renderizar
                    Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));
                    
                    Utils.showAlert(`✅ JSON cargado: ${data.length} registros, ${unidadesUnicas.size} unidades`, 'success');
                    Utils.log('JSON procesado exitosamente', { data: data.length, units: unidadesUnicas.size });
                    
                } catch (error) {
                    Utils.showAlert('Error al procesar el archivo JSON: ' + error.message, 'error');
                    Utils.log('Error procesando JSON', error);
                }
            },
            
            loadSavedData() {
                try {
                    const savedState = localStorage.getItem('magnaPartnersOrganigram');
                    if (savedState) {
                        const parsedState = JSON.parse(savedState);
                        
                        STATE.data = parsedState.data || [];
                        STATE.groupedData = parsedState.groupedData || {};
                        STATE.treeRoots = parsedState.treeRoots || [];
                        
                        if (STATE.data.length > 0) {
                            Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));
                            Utils.showAlert(`✅ Datos restaurados: ${STATE.data.length} registros`, 'success');
                        }
                        
                        return true;
                    }
                } catch (error) {
                    Utils.log('Error cargando desde localStorage', error);
                }
                return false;
            },
            
            clearSavedData() {
                if (confirm('¿Estás seguro de que quieres eliminar todos los datos guardados?')) {
                    localStorage.removeItem('magnaPartnersOrganigram');
                    Utils.showAlert('✅ Datos eliminados de localStorage.', 'success');
                    Renderer.renderTree([], document.getElementById('tree-container'));
                    document.getElementById('unidad-content').innerHTML = '<p>Seleccione una unidad para ver sus funciones</p>';
                }
            }
        };

        // ===== EXPORTACIÓN OPTIMIZADA PARA SAFARI =====
        const Exporter = {
            exportJSON() {
                try {
                    if (!STATE.data || STATE.data.length === 0) {
                        Utils.showAlert('No hay datos para exportar. Cargue un archivo primero.', 'warning');
                        return;
                    }
                    
                    const jsonData = {
                        metadata: {
                            exportDate: new Date().toISOString(),
                            version: CONFIG.VERSION,
                            totalRecords: STATE.data.length,
                            totalUnits: Object.keys(STATE.groupedData).length
                        },
                        data: {
                            unidades: Object.entries(STATE.groupedData).map(([nombre, funciones]) => ({
                                nombre,
                                reportaA: funciones[0]?.['Reporta A'] || '',
                                mision: funciones[0]?.['Misión'] || '',
                                funciones: funciones.map(func => ({
                                    tipo: func['Tipo de Función'] || 'Genérica',
                                    descripcion: func['Descripción'] || '',
                                    productoFinal: func['Producto Final'] || '',
                                    porcentajeDedicacion: func['Porcentaje Dedicación'] || ''
                                }))
                            }))
                        }
                    };

                    const jsonContent = JSON.stringify(jsonData, null, 2);
                    const blob = new Blob([jsonContent], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `magna_partners_organigrama_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`;
                    a.click();
                    URL.revokeObjectURL(url);

                    Utils.showAlert(`✅ JSON exportado (${STATE.data.length} registros)`, 'success');
                    
                } catch (error) {
                    Utils.log('Error en exportación', error);
                    Utils.showAlert(`Error: ${error.message}`, 'error');
                }
            }
        };

        // ===== EDITOR SIMPLIFICADO PARA SAFARI =====
        const Editor = {
            isEditMode: false,

            createNewUnit() {
                Utils.showAlert('Función de creación de unidades no implementada en esta versión Safari', 'warning');
            },

            toggleEditMode() {
                this.isEditMode = !this.isEditMode;
                const editModeBtn = document.querySelector('.edit-mode-btn');
                if (editModeBtn) {
                    if (this.isEditMode) {
                        editModeBtn.textContent = '✅ Salir Edición';
                        editModeBtn.classList.add('active');
                    } else {
                        editModeBtn.textContent = '✏️ Modo Edición';
                        editModeBtn.classList.remove('active');
                    }
                }
            }
        };

        // ===== GESTOR DE DESHACER SIMPLIFICADO PARA SAFARI =====
        const UndoManager = {
            history: [],
            maxHistory: 10,
            
            showHistory() {
                Utils.showAlert('Historial no implementado en esta versión Safari', 'warning');
            },
            
            hideHistory() {
                // No implementado
            }
        };

        // ===== EXPORTADOR PDF SIMPLIFICADO PARA SAFARI =====
        const PDFExporter = {
            exportToPDF() {
                Utils.showAlert('Exportación PDF no implementada en esta versión Safari', 'warning');
            }
        };

        // ===== FUNCIONES GLOBALES PARA SAFARI =====
        window.toggleNode = function(nodeKey) {
            try {
                const isExpanded = STATE.expandedNodes[nodeKey];
                
                if (isExpanded) {
                    delete STATE.expandedNodes[nodeKey];
                } else {
                    STATE.expandedNodes[nodeKey] = true;
                }
                
                // Re-renderizar el árbol
                Renderer.renderTree(STATE.treeRoots, document.getElementById('tree-container'));
                
                // Guardar estado en localStorage
                localStorage.setItem('expandedNodes', JSON.stringify(STATE.expandedNodes));
                
            } catch (error) {
                console.error('Error en toggleNode:', error);
            }
        };
        
        window.toggleEditMode = function() {
            Editor.toggleEditMode();
        };

        // ===== EVENT LISTENERS OPTIMIZADOS PARA SAFARI =====
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Inicializando aplicación para Safari...');
            
            // Intentar cargar datos guardados al iniciar
            const savedState = localStorage.getItem('magnaPartnersOrganigram');
            if (savedState) {
                try {
                    const parsedState = JSON.parse(savedState);
                    if (parsedState.data && parsedState.data.length > 0) {
                        if (confirm(`Se encontraron datos guardados (${parsedState.data.length} registros). ¿Deseas cargarlos?`)) {
                            Importer.loadSavedData();
                        }
                    }
                } catch (error) {
                    console.error('Error cargando datos guardados:', error);
                }
            }
            
            // File input
            const fileInput = document.getElementById('fileInput');
            if (fileInput) {
                fileInput.addEventListener('change', function(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    
                    Importer.processFile(file);
                });
            }
            
            // Browse button
            const browseBtn = document.getElementById('browseBtn');
            if (browseBtn) {
                browseBtn.addEventListener('click', function() {
                    const fileInput = document.getElementById('fileInput');
                    if (fileInput) {
                        fileInput.click();
                    }
                });
            }
            
            // Export button
            const exportBtn = document.getElementById('exportBtn');
            if (exportBtn) {
                exportBtn.addEventListener('click', function() {
                    if (STATE.data.length === 0) {
                        Utils.showAlert('No hay datos para exportar', 'warning');
                        return;
                    }
                    Exporter.exportJSON();
                });
            }
            
            // Validate button
            const validateBtn = document.getElementById('validateBtn');
            if (validateBtn) {
                validateBtn.addEventListener('click', function() {
                    if (STATE.data.length === 0) {
                        Utils.showAlert('No hay datos para validar', 'warning');
                        return;
                    }
                    
                    const totalRecords = STATE.data.length;
                    const totalUnits = Object.keys(STATE.groupedData).length;
                    const message = `Validación completada:\n• Total registros: ${totalRecords}\n• Total unidades: ${totalUnits}`;
                    
                    Utils.showAlert(message, 'success');
                });
            }
            
            console.log('✅ Aplicación inicializada para Safari');
        });

        // ===== DIAGNÓSTICO AUTOMÁTICO PARA SAFARI =====
        function runSafariDiagnostic() {
            console.log('🔍 Ejecutando diagnóstico Safari...');
            
            const userAgent = navigator.userAgent;
            const isSafari = /Safari/.test(userAgent) && !/Chrome/.test(userAgent);
            const isWebKit = /WebKit/.test(userAgent);
            const isMac = /Mac/.test(userAgent);
            
            console.log('🌐 Información del navegador:', {
                userAgent: userAgent,
                isSafari: isSafari,
                isWebKit: isWebKit,
                isMac: isMac
            });
            
            // Verificar funcionalidades críticas
            const checks = {
                createElement: typeof document.createElement === 'function',
                getElementById: typeof document.getElementById === 'function',
                querySelector: typeof document.querySelector === 'function',
                addEventListener: typeof document.addEventListener === 'function',
                localStorage: typeof localStorage !== 'undefined',
                JSONParse: typeof JSON.parse === 'function',
                JSONStringify: typeof JSON.stringify === 'function'
            };
            
            console.log('✅ Compatibilidad verificada:', checks);
            
            const failedChecks = Object.entries(checks).filter(([key, value]) => !value);
            if (failedChecks.length > 0) {
                console.error('❌ Fallos en compatibilidad:', failedChecks);
                Utils.showAlert('Se detectaron problemas de compatibilidad con Safari', 'warning');
            } else {
                console.log('✅ Todas las verificaciones de compatibilidad pasaron');
            }
        }
        
        // Ejecutar diagnóstico
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', runSafariDiagnostic);
        } else {
            runSafariDiagnostic();
        }
    </script>
