<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Reordenamiento Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .tree-node { 
            padding: 10px; 
            margin: 5px; 
            border: 1px solid #ddd; 
            background: #f9f9f9;
            cursor: move;
            user-select: none;
        }
        .tree-node.dragging { opacity: 0.5; }
        .tree-node.drag-over { background: #e0f7fa; border-color: #00bcd4; }
        .debug-info { 
            background: #f5f5f5; 
            padding: 10px; 
            margin: 10px 0; 
            font-family: monospace; 
            font-size: 12px;
        }
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Test de Reordenamiento Debug</h1>
    
    <div class="test-section">
        <h3>Test de Keys</h3>
        <button onclick="testKeyParsing()">Probar Parsing de Keys</button>
        <div id="key-test-results" class="debug-info"></div>
    </div>
    
    <div class="test-section">
        <h3>Test de Reordenamiento</h3>
        <button onclick="enableEditMode()">Activar Modo Edición</button>
        <div id="tree-container">
            <div class="tree-node" draggable="true" data-key="Unidad1|">
                <span>Unidad 1 (Raíz)</span>
            </div>
            <div class="tree-node" draggable="true" data-key="Unidad2|">
                <span>Unidad 2 (Raíz)</span>
            </div>
            <div class="tree-node" draggable="true" data-key="Unidad3|Unidad1">
                <span>Unidad 3 (Hijo de Unidad1)</span>
            </div>
            <div class="tree-node" draggable="true" data-key="Unidad4|Unidad1">
                <span>Unidad 4 (Hijo de Unidad1)</span>
            </div>
        </div>
    </div>
    
    <div class="test-section">
        <h3>Logs de Debug</h3>
        <div id="debug-logs" class="debug-info"></div>
        <button onclick="clearLogs()">Limpiar Logs</button>
    </div>

    <script>
        // Función para logging
        function log(message, data = null) {
            const logsDiv = document.getElementById('debug-logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            if (data) {
                logEntry.innerHTML += `<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        // Test de parsing de keys
        function testKeyParsing() {
            const testKeys = [
                'Unidad1|',
                'Unidad2|',
                'Unidad3|Unidad1',
                'Unidad4|Unidad1'
            ];
            
            const results = testKeys.map(key => {
                const [name, parent] = key.split('|');
                return { key, name, parent: parent || null };
            });
            
            document.getElementById('key-test-results').innerHTML = 
                `<pre>${JSON.stringify(results, null, 2)}</pre>`;
            
            log('Test de parsing de keys completado', results);
        }

        // Activar modo edición
        function enableEditMode() {
            const nodes = document.querySelectorAll('.tree-node');
            nodes.forEach(node => {
                node.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', node.dataset.key);
                    node.classList.add('dragging');
                    log('Drag start', { key: node.dataset.key });
                });
                
                node.addEventListener('dragend', () => {
                    node.classList.remove('dragging');
                    log('Drag end');
                });
                
                node.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    node.classList.add('drag-over');
                });
                
                node.addEventListener('dragleave', () => {
                    node.classList.remove('drag-over');
                });
                
                node.addEventListener('drop', (e) => {
                    e.preventDefault();
                    node.classList.remove('drag-over');
                    const draggedKey = e.dataTransfer.getData('text/plain');
                    const targetKey = node.dataset.key;
                    
                    if (draggedKey !== targetKey) {
                        const [draggedName, draggedParent] = draggedKey.split('|');
                        const [targetName, targetParent] = targetKey.split('|');
                        
                        log('Drop detectado', {
                            draggedKey,
                            targetKey,
                            draggedName,
                            draggedParent: draggedParent || null,
                            targetName,
                            targetParent: targetParent || null
                        });
                        
                        // Verificar si están en el mismo nivel
                        if (draggedParent === targetParent) {
                            log('REORDENAMIENTO en el mismo nivel');
                            // Simular reordenamiento
                            setTimeout(() => {
                                log('Reordenamiento simulado completado');
                            }, 100);
                        } else {
                            log('MOVIMIENTO a diferente nivel');
                            // Simular movimiento
                            setTimeout(() => {
                                log('Movimiento simulado completado');
                            }, 100);
                        }
                    }
                });
            });
            
            log('Modo edición activado');
        }

        // Limpiar logs
        function clearLogs() {
            document.getElementById('debug-logs').innerHTML = '';
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            log('Test de reordenamiento inicializado');
        });
    </script>
</body>
</html>
