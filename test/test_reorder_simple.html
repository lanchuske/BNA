<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Reordenamiento Simple</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-container { 
            display: flex; 
            gap: 20px; 
            margin: 20px 0; 
        }
        .tree-section { 
            flex: 1; 
            border: 1px solid #ccc; 
            padding: 15px; 
        }
        .tree-node { 
            padding: 8px; 
            margin: 4px; 
            border: 1px solid #ddd; 
            background: #f9f9f9;
            cursor: move;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tree-node.dragging { opacity: 0.5; }
        .tree-node.drag-over { background: #e0f7fa; border-color: #00bcd4; }
        .debug-info { 
            background: #f5f5f5; 
            padding: 10px; 
            margin: 10px 0; 
            font-family: monospace; 
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        button { padding: 8px; margin: 5px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>Test de Reordenamiento Simple</h1>
    
    <div class="test-container">
        <div class="tree-section">
            <h3>Árbol Original</h3>
            <div id="original-tree">
                <div class="tree-node" draggable="true" data-key="Unidad1|">
                    <span>Unidad 1 (Raíz)</span>
                    <span style="font-size: 10px; color: #666;">Unidad1|</span>
                </div>
                <div class="tree-node" draggable="true" data-key="Unidad2|">
                    <span>Unidad 2 (Raíz)</span>
                    <span style="font-size: 10px; color: #666;">Unidad2|</span>
                </div>
                <div class="tree-node" draggable="true" data-key="Unidad3|Unidad1">
                    <span>Unidad 3 (Hijo de Unidad1)</span>
                    <span style="font-size: 10px; color: #666;">Unidad3|Unidad1</span>
                </div>
                <div class="tree-node" draggable="true" data-key="Unidad4|Unidad1">
                    <span>Unidad 4 (Hijo de Unidad1)</span>
                    <span style="font-size: 10px; color: #666;">Unidad4|Unidad1</span>
                </div>
            </div>
        </div>
        
        <div class="tree-section">
            <h3>Árbol Resultado</h3>
            <div id="result-tree"></div>
        </div>
    </div>
    
    <div class="test-section">
        <h3>Controles</h3>
        <button onclick="testKeyParsing()">Probar Parsing de Keys</button>
        <button onclick="testReordering()">Probar Reordenamiento</button>
        <button onclick="testMovement()">Probar Movimiento</button>
        <button onclick="clearLogs()">Limpiar Logs</button>
    </div>
    
    <div class="test-section">
        <h3>Estado</h3>
        <div id="status" class="status info">Listo para pruebas</div>
    </div>
    
    <div class="test-section">
        <h3>Logs de Debug</h3>
        <div id="debug-logs" class="debug-info"></div>
    </div>

    <script>
        // Función para logging
        function log(message, data = null) {
            const logsDiv = document.getElementById('debug-logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            if (data) {
                logEntry.innerHTML += `<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        // Función para actualizar estado
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        // Test de parsing de keys
        function testKeyParsing() {
            const testKeys = [
                'Unidad1|',
                'Unidad2|',
                'Unidad3|Unidad1',
                'Unidad4|Unidad1'
            ];
            
            const results = testKeys.map(key => {
                const [name, parent] = key.split('|');
                const normalizedParent = parent || null;
                return { key, name, parent: normalizedParent };
            });
            
            log('Test de parsing de keys completado', results);
            updateStatus('Parsing de keys completado', 'success');
        }

        // Test de reordenamiento
        function testReordering() {
            log('Iniciando test de reordenamiento...');
            updateStatus('Test de reordenamiento iniciado', 'info');
            
            // Simular reordenamiento de unidades raíz
            const draggedKey = 'Unidad1|';
            const targetKey = 'Unidad2|';
            
            const [draggedName, draggedParent] = draggedKey.split('|');
            const [targetName, targetParent] = targetKey.split('|');
            
            const normalizedDraggedParent = draggedParent || null;
            const normalizedTargetParent = targetParent || null;
            
            log('Análisis de reordenamiento:', {
                draggedKey,
                targetKey,
                draggedName,
                draggedParent: normalizedDraggedParent,
                targetName,
                targetParent: normalizedTargetParent
            });
            
            if (normalizedDraggedParent === normalizedTargetParent) {
                log('✅ REORDENAMIENTO detectado - mismo nivel');
                updateStatus('Reordenamiento detectado correctamente', 'success');
            } else {
                log('❌ MOVIMIENTO detectado - diferente nivel');
                updateStatus('Movimiento detectado (incorrecto para reordenamiento)', 'error');
            }
        }

        // Test de movimiento
        function testMovement() {
            log('Iniciando test de movimiento...');
            updateStatus('Test de movimiento iniciado', 'info');
            
            // Simular movimiento de unidad raíz a hijo
            const draggedKey = 'Unidad1|';
            const targetKey = 'Unidad3|Unidad1';
            
            const [draggedName, draggedParent] = draggedKey.split('|');
            const [targetName, targetParent] = targetKey.split('|');
            
            const normalizedDraggedParent = draggedParent || null;
            const normalizedTargetParent = targetParent || null;
            
            log('Análisis de movimiento:', {
                draggedKey,
                targetKey,
                draggedName,
                draggedParent: normalizedDraggedParent,
                targetName,
                targetParent: normalizedTargetParent
            });
            
            if (normalizedDraggedParent === normalizedTargetParent) {
                log('❌ REORDENAMIENTO detectado (incorrecto para movimiento)');
                updateStatus('Reordenamiento detectado (incorrecto para movimiento)', 'error');
            } else {
                log('✅ MOVIMIENTO detectado correctamente - diferente nivel');
                updateStatus('Movimiento detectado correctamente', 'success');
            }
        }

        // Limpiar logs
        function clearLogs() {
            document.getElementById('debug-logs').innerHTML = '';
            updateStatus('Logs limpiados', 'info');
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            log('Test de reordenamiento simple inicializado');
            updateStatus('Listo para pruebas', 'info');
        });
    </script>
</body>
</html>
